<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Dogs</title>
</head>

<body>
    <div class="flex flex-col mx-10">
        <div class="flex gap-10 items-center my-10">
            <div class="">
                <label for="dog">Dogs category :</label>
                <select name="dog" id="dog-category" class="w-35 h-12 border rounded-xl">
                    <option value="Leonberg">Leonberg</option>
                    <option value="pitbull">pitbull</option>
                    <option value="Husky">Husky</option>
                    <option value="Appenzeller">Appenzeller</option>
                    <option value="Akita">Akita</option>
                </select>
            </div>
            <button id="btn"
                class="w-25 h-10 text-white bg-blue-600 rounded-sm border-none cursor-pointer">Get
                Dogs</button>
        </div>
        <div id="dogs-img"></div>
    </div>


    <script>
        let result = document.getElementById("dogs-img")
        let dog_breed = document.getElementById("dog-category")

        // console.log(dog_breed)

        let btn = document.getElementById("btn")

        btn.addEventListener("click", getDogs)

        async function getDogs() {
            result.innerHTML = ""
            try {
                // console.log(dog_breed.value)
                await fetch(`https://dog.ceo/api/breed/${dog_breed.value}/images/random`)
                    .then((response) => response.json())
                    .then((data) => {
                        let img = document.createElement("img");
                        img.style.width = "400px";
                        img.style.height = "400px";
                        img.style.objectFit = "contain";
                        img.src = data.message

                        result.append(img);
                    })
            } catch (error) {
                console.error(error.message)
            }

        }
    </script>
</body>

</html>
